<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robi · Agente IA</title>
<style>
:root{--bg:#0b0d14;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#e8eaf2;--mut:#8b90a3;--ac:#7c8cff;--ac2:#4ee0c1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 10% -10%,#26307a55,transparent),radial-gradient(700px 500px at 100% 100%,#0f6b5d44,transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;color:#0b0d14;flex:none}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;color:var(--mut);font-weight:400;font-size:11px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;border:1px solid var(--bd);word-wrap:break-word;overflow-wrap:anywhere}
.u{align-self:flex-end;background:linear-gradient(135deg,#5563e8cc,#7c8cffaa);border-color:transparent}
.a{align-self:flex-start;background:var(--card);backdrop-filter:blur(10px)}
.m p{margin:0 0 .5em}.m p:last-child{margin:0}
.tag{margin-top:6px;font-size:10.5px;color:var(--mut)}
pre{background:#05060b;border:1px solid var(--bd);border-radius:10px;padding:10px;overflow-x:auto;font-size:12.5px;margin:.5em 0;position:relative}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
:not(pre)>code{background:#ffffff14;padding:1px 5px;border-radius:5px;font-size:.9em}
.cp{position:absolute;top:4px;right:4px;font-size:11px;padding:2px 7px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px}
#chips button{white-space:nowrap;font-size:13px;color:var(--mut)}
form{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px)}
textarea,input[type="password"]{width:100%;background:#00000040;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;outline:none}
textarea:focus,input[type="password"]:focus{border-color:var(--ac)}
form textarea{flex:1;resize:none;max-height:140px;border-radius:14px}
#send{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0b0d14;border:0;font-weight:700;border-radius:14px;padding:0 16px}
dialog{background:#12151f;color:var(--tx);border:1px solid var(--bd);border-radius:16px;width:min(92vw,460px);padding:18px}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
dialog textarea{min-height:130px}
#att{display:none;gap:8px;overflow-x:auto;padding:8px 14px 0;background:var(--card)}
.th{position:relative;flex:none;height:64px;min-width:64px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:#0006;display:grid;place-items:center;font-size:12px}
.th.doc{padding:0 22px 0 10px}
.th img,.th video{height:64px;width:auto;display:block}
.th button{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px;border-radius:50%;font-size:13px;background:#000a}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.mt img,.mt video{height:70px;border-radius:8px}
.mt span{background:#0005;border-radius:8px;padding:4px 8px;font-size:12px}
#pick{padding:0 12px;font-size:18px;border-radius:14px}
.err{color:#ff8f8f}
.ok{color:var(--ac2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:#ff6b6b}
.dot.on{background:#4ee0c1}
#keyMsg{min-height:20px;font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<header>
  <div class="logo">R</div>
  <h1>Robi<small>Agente personal · Gemini</small></h1>
  <button id="keyBtn"><span id="dot" class="dot"></span>API Key</button>
  <button id="mem">Memoria</button>
  <button id="clr">Nuevo</button>
</header>

<div id="log"></div>

<div id="chips">
  <button>Armame una app web en un solo HTML</button>
  <button>Revisá y optimizá este código</button>
  <button>¿De qué venimos hablando?</button>
</div>

<div id="att"></div>

<form id="f">
  <button id="pick" type="button" aria-label="Adjuntar">📎</button>
  <input id="file" type="file" multiple hidden accept="image/*,video/*,text/*,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log">
  <textarea id="t" rows="1" placeholder="Escribile a Robi…"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>

<dialog id="dlg">
  <p style="margin-top:0"><b>Memoria de Robi</b><br><small style="color:var(--mut)">Datos, gustos y proyectos que Robi recordará en cada conversación.</small></p>
  <textarea id="memt" placeholder="Ej: Trabajo con HTML en un solo archivo. Me gusta el estilo oscuro con glassmorphism."></textarea>
  <p style="display:flex;gap:8px;justify-content:flex-end;margin:12px 0 0"><button id="memc" type="button">Cancelar</button><button id="mems" type="button" style="background:var(--ac);color:#0b0d14;border:0;font-weight:600">Guardar</button></p>
</dialog>

<dialog id="keyDlg">
  <p style="margin-top:0"><b>Clave de Gemini API</b><br><small style="color:var(--mut)">Pegá tu clave de Google AI Studio. Se guarda solo en este navegador.</small></p>
  <input id="keyIn" type="password" placeholder="Pegá tu clave acá" autocomplete="off" spellcheck="false">
  <div id="keyMsg"></div>
  <p style="display:flex;gap:8px;justify-content:flex-end;margin:12px 0 0"><button id="keyc" type="button">Cerrar</button><button id="keyt" type="button">Probar</button><button id="keys" type="button" style="background:var(--ac2);color:#0b0d14;border:0;font-weight:600">Guardar</button></p>
</dialog>

<script>
"use strict";
const SYS = "Sos Robi, asistente personal de IA, programador senior full-stack y colaborador estratégico. Personalidad: cercano, pragmático, eficiente, directo, con estilo limpio y precisión técnica. Hablás en español rioplatense. Dominás HTML5, Tailwind CSS, JavaScript ES6+, React, PWA, Firebase, serverless e integración de APIs. Escribís código limpio, modular, optimizado para móvil y con estética oscura minimalista tipo glassmorphism, salvo que se pida otra cosa; por defecto entregás un solo archivo HTML completo y funcional. Ante un problema, analizás el cuello de botella y proponés la solución más eficiente. Si te piden un resumen de lo conversado, das un resumen ejecutivo y estructurado (estado, decisiones, pendientes) con tu opinión analítica. Respuestas breves salvo que se pida detalle. Si no sabés algo, lo decís; no inventás.";

// Modelos estables y oficiales en Google AI Studio (con fallback automático)
const MODELS = ["gemini-2.0-flash", "gemini-1.5-flash"];
const MAX_IMAGES = 12;
const TIMEOUT_MS = 25000;

const $ = s => document.querySelector(s);
const log = $("#log"), t = $("#t"), sendBtn = $("#send");
let hist = [], mem = "", apiKey = "", busy = false, pending = [];

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

hist = load("robi_hist", []);
mem = load("robi_mem", "");
apiKey = load("robi_gemini_key", "");
if(!Array.isArray(hist)) hist = [];
if(typeof apiKey !== "string") apiKey = "";
if(typeof mem !== "string") mem = "";

const updateDot = () => $("#dot").className = "dot" + (apiKey.trim() ? " on" : "");
updateDot();

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(src){
  return String(src).split(/```/).map((p,i)=>{
    if(i%2){
      const nl = p.indexOf("\n");
      const code = nl>-1 ? p.slice(nl+1) : p;
      return '<pre><button class="cp" type="button">Copiar</button><code>'+esc(code.replace(/\n$/,""))+'</code></pre>';
    }
    return esc(p).split(/\n{2,}/).filter(x=>x.trim()).map(x=>'<p>'+x.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")+'</p>').join("");
  }).join("");
}

function bubble(role, text){
  const d = document.createElement("div");
  d.className = "m " + (role==="user" ? "u" : "a");
  d.innerHTML = md(text);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function render(){
  log.innerHTML = "";
  if(!hist.length){
    bubble("assistant", apiKey.trim()
      ? "Soy Robi. Contame qué estamos construyendo hoy o compartime algún archivo."
      : "Soy Robi. Para empezar, tocá **API Key** arriba y pegá tu clave de Google AI Studio.");
  }
  hist.forEach(m => bubble(m.role, m.content));
  $("#chips").style.display = hist.length ? "none" : "flex";
}

log.addEventListener("click", e=>{
  if(e.target.classList.contains("cp")){
    const c = e.target.parentElement.querySelector("code").textContent;
    const done = () => { e.target.textContent = "Copiado"; setTimeout(()=>e.target.textContent="Copiar",1200); };
    if(navigator.clipboard) navigator.clipboard.writeText(c).then(done).catch(()=>{});
  }
});

/* ---------- Archivos ---------- */
const blobToBase64 = blob => new Promise((res, rej)=>{
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(",")[1]);
  r.onerror = () => rej(new Error("No pude leer un archivo."));
  r.readAsDataURL(blob);
});

async function toJpeg(file){
  try{
    const bm = await createImageBitmap(file);
    const c = document.createElement("canvas");
    c.width = bm.width; c.height = bm.height;
    c.getContext("2d").drawImage(bm,0,0);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.88));
  }catch(e){ return null; }
}

function frames(file, n){
  return new Promise(res=>{
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto";
    const u = URL.createObjectURL(file); v.src = u;
    const out = [], c = document.createElement("canvas");
    let i = 0, dur = 0, done = false;
    const fin = ()=>{ if(done) return; done = true; URL.revokeObjectURL(u); res({blobs:out,dur}); };
    const tt = k => dur*(k+.5)/n;
    v.onerror = fin;
    v.onloadedmetadata = ()=>{ dur = v.duration; if(!isFinite(dur) || dur <= 0) return fin(); v.currentTime = tt(0); };
    v.onseeked = ()=>{
      const s = Math.min(1, 1024/Math.max(v.videoWidth,v.videoHeight,1));
      c.width = Math.round(v.videoWidth*s); c.height = Math.round(v.videoHeight*s);
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      c.toBlob(b=>{ if(b) out.push(b); i++; if(i >= n) fin(); else v.currentTime = tt(i); },"image/jpeg",.8);
    };
    setTimeout(fin, 20000);
  });
}

async function prepare(files){
  const parts = [], notes = [], texts = [];
  for(const p of files){
    const f = p.file;
    if(p.type.startsWith("image/")){
      if(parts.length >= MAX_IMAGES){ notes.push("foto “"+p.name+"” (omitida, límite de imágenes)"); continue; }
      const b = ["image/jpeg","image/png","image/webp"].includes(f.type) ? f : ((await toJpeg(f)) || f);
      parts.push({ inlineData: { mimeType: b.type || "image/jpeg", data: await blobToBase64(b) } });
      notes.push("foto “"+p.name+"”");
    } else if(p.type.startsWith("video/")){
      const n = Math.min(5, MAX_IMAGES - parts.length);
      if(n < 1){ notes.push("video “"+p.name+"” (omitido, límite de imágenes)"); continue; }
      const r = await frames(f, n);
      for(const b of r.blobs) parts.push({ inlineData: { mimeType: "image/jpeg", data: await blobToBase64(b) } });
      notes.push(r.blobs.length ? "video “"+p.name+"” ("+Math.round(r.dur)+" s, "+r.blobs.length+" fotogramas, sin audio)" : "video “"+p.name+"” (no se pudo leer)");
    } else {
      try{
        const tx = await f.text();
        texts.push("[Archivo “"+p.name+"”]\n"+tx.slice(0,60000));
        notes.push("archivo “"+p.name+"”");
      }catch(e){}
    }
  }
  return { mediaParts: parts, textBlock: texts.join("\n\n"), note: notes.length ? "\n\n[Adjunto: "+notes.join(", ")+"]" : "" };
}

const isTxt = f => f.type.startsWith("text/") || /\.(txt|md|json|csv|js|ts|py|html|css|xml|ya?ml|log)$/i.test(f.name);

function drawAtt(){
  const a = $("#att"); a.innerHTML = "";
  a.style.display = pending.length ? "flex" : "none";
  pending.forEach((p,i)=>{
    const d = document.createElement("div"); d.className = "th";
    if(p.type.startsWith("image/")){ const im = document.createElement("img"); im.src = p.url; d.appendChild(im); }
    else if(p.type.startsWith("video/")){ const v = document.createElement("video"); v.src = p.url; v.muted = true; v.preload = "metadata"; v.playsInline = true; d.appendChild(v); }
    else { d.className = "th doc"; d.textContent = "📄 " + p.name.slice(0,14); }
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×";
    x.onclick = ()=>{ URL.revokeObjectURL(p.url); pending.splice(i,1); drawAtt(); };
    d.appendChild(x); a.appendChild(d);
  });
}

function addThumbs(div, files){
  if(!files.length) return;
  const w = document.createElement("div"); w.className = "mt";
  files.forEach(p=>{
    let el;
    if(p.type.startsWith("image/")){ el = document.createElement("img"); el.src = p.url; }
    else if(p.type.startsWith("video/")){ el = document.createElement("video"); el.src = p.url; el.muted = true; el.controls = true; el.playsInline = true; }
    else { el = document.createElement("span"); el.textContent = "📄 " + p.name; }
    w.appendChild(el);
  });
  div.prepend(w);
}

/* ---------- Gemini ---------- */
async function callGemini(contents, sys, onSwitch){
  const key = apiKey.trim();
  let lastErr = "No hubo respuesta."; const errs = [];
  for(let i = 0; i < MODELS.length; i++){
    const m = MODELS[i], last = i === MODELS.length - 1;
    let res, data;
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), TIMEOUT_MS);
    try{
      res = await fetch("[https://generativelanguage.googleapis.com/v1beta/models/](https://generativelanguage.googleapis.com/v1beta/models/)" + m + ":generateContent?key=" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents }),
        signal: ctrl.signal
      });
      data = await res.json().catch(()=>({}));
      clearTimeout(timer);
    }catch(e){
      clearTimeout(timer);
      lastErr = e && e.name === "AbortError" ? (m + " tardó más de " + (TIMEOUT_MS/1000) + " s sin responder.") : "Error de conexión. Revisá tu internet.";
      errs.push(m + ": " + lastErr);
      if(!last){ onSwitch && onSwitch(MODELS[i+1], lastErr); continue; }
      throw new Error(errs.join("\n"));
    }
    if(res.ok){
      const c = data.candidates && data.candidates[0];
      const txt = c && c.content && c.content.parts ? c.content.parts.map(p => p.text || "").join("") : "";
      if(txt) return { reply: txt, model: m };
      const why = (data.promptFeedback && data.promptFeedback.blockReason) || (c && c.finishReason) || "respuesta vacía";
      lastErr = "Gemini no devolvió texto (" + why + ").";
      errs.push(m + ": " + lastErr);
      if(!last){ onSwitch && onSwitch(MODELS[i+1], lastErr); continue; }
      throw new Error(errs.join("\n"));
    }
    const msg = (data.error && data.error.message) || ("Error HTTP " + res.status);
    if((res.status === 400 || res.status === 401 || res.status === 403) && /api key|permission|unauthenticated|not valid/i.test(msg)){
      throw new Error("La API Key no es válida o no tiene permiso. Revisala en el botón API Key.");
    }
    lastErr = msg;
    errs.push(m + ": " + msg);
    const retry = [404,429,500,503].includes(res.status) || /high demand|overloaded|not found/i.test(msg);
    if(retry && !last){ onSwitch && onSwitch(MODELS[i+1], lastErr); continue; }
    throw new Error(res.status === 429 ? "Llegaste al límite de uso del nivel gratuito. Esperá un minuto e intentá de nuevo." : errs.join("\n"));
  }
  throw new Error(errs.join("\n") || lastErr);
}

async function ask(text){
  if(busy || (!text.trim() && !pending.length)) return;
  if(!apiKey.trim()){ $("#keyIn").value = ""; $("#keyMsg").textContent = ""; $("#keyDlg").showModal(); return; }

  busy = true; sendBtn.disabled = true;
  $("#chips").style.display = "none";
  const files = pending; pending = []; drawAtt();
  text = text.trim() || "Analizá estos adjuntos.";

  const ub = bubble("user", text);
  addThumbs(ub, files);
  const out = bubble("assistant", "Pensando…");

  try{
    const prep = await prepare(files);

    const contents = [];
    for(const m of hist.slice(-24)){
      const role = m.role === "assistant" ? "model" : "user";
      if(contents.length && contents[contents.length-1].role === role) contents[contents.length-1].parts[0].text += "\n" + m.content;
      else contents.push({ role, parts: [{ text: m.content }] });
    }
    while(contents.length && contents[0].role !== "user") contents.shift();

    const current = [{ text: text + prep.note + (prep.textBlock ? "\n\n" + prep.textBlock : "") }, ...prep.mediaParts];
    if(contents.length && contents[contents.length-1].role === "user") contents[contents.length-1].parts.push(...current);
    else contents.push({ role: "user", parts: current });

    const sys = SYS + (mem.trim() ? "\n\n[MEMORIA PERSISTENTE DEL USUARIO]\n" + mem.trim() : "");
    const r = await callGemini(contents, sys, (m, why) => { out.textContent = "Cambiando a " + m + "… (" + String(why).slice(0,140) + ")"; });

    out.innerHTML = md(r.reply) + '<div class="tag">' + esc(r.model) + '</div>';
    hist.push({ role: "user", content: text + prep.note });
    hist.push({ role: "assistant", content: r.reply });
    save("robi_hist", hist);
  }catch(e){
    out.innerHTML = '<span class="err">' + esc(e && e.message ? e.message : "Error inesperado.").replace(/\n/g,"<br>") + '</span>';
  }finally{
    busy = false; sendBtn.disabled = false; log.scrollTop = log.scrollHeight;
  }
}

/* ---------- Eventos ---------- */
$("#pick").onclick = ()=>$("#file").click();
$("#file").addEventListener("change", e=>{
  for(const f of e.target.files){
    const vis = f.type.startsWith("image/") || f.type.startsWith("video/");
    if(!vis && !isTxt(f)){ bubble("assistant","“"+f.name+"” no es un tipo soportado. Probá con foto, video o archivo de texto o código."); continue; }
    if(f.size > (f.type.startsWith("video/") ? 100 : 20)*1048576){ bubble("assistant","“"+f.name+"” pesa demasiado."); continue; }
    pending.push({ file:f, url:URL.createObjectURL(f), type:f.type, name:f.name });
  }
  e.target.value = ""; drawAtt();
});

$("#f").addEventListener("submit", e=>{ e.preventDefault(); const v = t.value; t.value = ""; t.style.height = "auto"; ask(v); });
t.addEventListener("input", ()=>{ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight,140) + "px"; });
t.addEventListener("keydown", e=>{ if(e.key === "Enter" && !e.shiftKey && window.innerWidth > 700){ e.preventDefault(); $("#f").requestSubmit(); } });
$("#chips").addEventListener("click", e=>{ if(e.target.tagName === "BUTTON") ask(e.target.textContent); });
$("#clr").onclick = ()=>{ if(busy) return; hist = []; save("robi_hist", hist); render(); };

$("#mem").onclick = ()=>{ $("#memt").value = mem; $("#dlg").showModal(); };
$("#memc").onclick = ()=>$("#dlg").close();
$("#mems").onclick = ()=>{ mem = $("#memt").value; save("robi_mem", mem); $("#dlg").close(); };

$("#keyBtn").onclick = ()=>{ $("#keyIn").value = apiKey; $("#keyMsg").textContent = ""; $("#keyDlg").showModal(); };
$("#keyc").onclick = ()=>$("#keyDlg").close();
$("#keys").onclick = ()=>{
  apiKey = $("#keyIn").value.trim().replace(/\s+/g,"");
  save("robi_gemini_key", apiKey);
  updateDot(); $("#keyDlg").close();
  if(!hist.length) render();
};
$("#keyt").onclick = async ()=>{
  const msg = $("#keyMsg"), prev = apiKey;
  const k = $("#keyIn").value.trim().replace(/\s+/g,"");
  if(!k){ msg.className = "err"; msg.textContent = "Pegá primero la clave."; return; }
  msg.className = ""; msg.textContent = "Probando…";
  apiKey = k;
  try{
    const r = await callGemini([{ role:"user", parts:[{ text:"Respondé solo: OK" }] }], "Respondé en una palabra.");
    msg.className = "ok"; msg.textContent = "Funciona ✓ (" + r.model + ")";
  }catch(e){
    msg.className = "err"; msg.textContent = e.message;
  }
  apiKey = prev;
};

render();
</script>
</body>
</html>
